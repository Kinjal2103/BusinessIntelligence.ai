name: revenue
definition: Total sales revenue generated by regional purchases.
calculation: "SELECT date, region, revenue FROM revenue_daily"
source_table: revenue_daily
grain: daily
calendar: Gregorian
refresh_cadence: daily
known_drivers:
  - server_latency
  - marketing_spend
  - churn
materiality_threshold:
  pct_change: 0.10
  absolute_change: 5000.00
lineage:
  source_system: Data Warehouse (DWH)
  owner: Finance Team
access_restrictions:
  CFO:
    scope: company_wide
    columns: ["date", "region", "revenue"]
  Regional_Ops_Manager:
    scope: regional
    row_filter: "region = :user_region"
    columns: ["date", "region", "revenue"]
